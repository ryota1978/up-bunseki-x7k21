<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SNS自動投稿プロトタイプ - 投稿トピック入力</title>
<style>
  body { font-family: -apple-system, "Hiragino Kaku Gothic ProN", sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; color: #1f2937; }
  h1 { font-size: 20px; }
  label { display: block; margin-top: 16px; font-weight: bold; font-size: 14px; }
  input, textarea, select { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; font-size: 14px; border: 1px solid #d1d5db; border-radius: 6px; }
  textarea { height: 80px; }
  button { margin-top: 20px; padding: 10px 20px; background: #2563eb; color: white; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; }
  button:disabled { background: #9ca3af; }
  #status { margin-top: 16px; font-size: 13px; color: #6b7280; white-space: pre-line; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; margin-right: 6px; }
  .live { background: #d1fae5; color: #065f46; }
  .mock { background: #fef3c7; color: #92400e; }
</style>
</head>
<body>
<h1>SNS自動投稿プロトタイプ</h1>
<div id="statusBadges"></div>
<p style="font-size:13px;color:#6b7280">投稿したいトピックを入力すると、下地作成→イラスト生成→自動レビューを行い、確認画面に移動します。</p>

<form id="topicForm">
  <label>見出し(headline)</label>
  <input name="headline" placeholder="例: 三重県内で新規開局3件" required>

  <label>詳細(details)</label>
  <textarea name="details" placeholder="例: 今月は津市・四日市市・鈴鹿市で新規開局がありました。"></textarea>

  <label>カテゴリ</label>
  <select name="category">
    <option value="新規開局">新規開局</option>
    <option value="閉局">閉局</option>
    <option value="お知らせ">お知らせ</option>
    <option value="その他">その他</option>
  </select>

  <button type="submit" id="submitBtn">下地を作成する</button>
</form>
<div id="status"></div>

<script>
const form = document.getElementById('topicForm');
const statusEl = document.getElementById('status');
const submitBtn = document.getElementById('submitBtn');

fetch('/api/status').then(r => r.json()).then(s => {
  const badges = document.getElementById('statusBadges');
  const label = { claude: 'Claude', openai: 'OpenAI', instagram: 'Instagram' };
  badges.innerHTML = Object.entries(s).map(([k, v]) =>
    `<span class="badge ${v}">${label[k]}: ${v === 'live' ? '実API' : 'モック'}</span>`
  ).join('');
});

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  submitBtn.disabled = true;
  statusEl.textContent = '生成中... (下地作成 → イラスト生成 → 自動レビューを実行しています)';
  const data = Object.fromEntries(new FormData(form).entries());
  try {
    const res = await fetch('/api/generate', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(data),
    });
    const json = await res.json();
    if (!res.ok) throw new Error(json.error || '生成に失敗しました');
    location.href = `/review.html?id=${json.id}`;
  } catch (err) {
    statusEl.textContent = 'エラー: ' + err.message;
    submitBtn.disabled = false;
  }
});
</script>
</body>
</html>
